worker_processes auto;
pid /run/gmi-web/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /opt/gmi-web/mime.types;
    default_type application/octet-stream;
    access_log syslog:server=unix:/dev/log,tag=gmi_web,severity=info combined;
    sendfile on;
    server_tokens off;

    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https https;
        http http;
    }

    client_body_temp_path /run/gmi-web/client;
    proxy_temp_path /run/gmi-web/proxy;
    fastcgi_temp_path /run/gmi-web/fastcgi;
    uwsgi_temp_path /run/gmi-web/uwsgi;
    scgi_temp_path /run/gmi-web/scgi;

    server {
        listen 8080;
        server_name _;
        root /opt/gmi-web/site;
        index index.html;
        client_max_body_size 16m;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
